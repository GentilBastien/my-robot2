<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="inline-bro">
      <div id="block-login-a">
        <label for="connect-ws-input">connect to webserver</label>
        <input id="connect-ws-input" type="text" />
        <button id="connect-ws">Connect to Webserver</button>
      </div>
      <span id="connected-span"></span>

      <button id="disconnect-ws" style="display: none" disabled>Disconnect from Webserver</button>
    </div>

    <div id="queue-div" class="inline-bro" style="display: none">
      <button id="enter-queue-btn">Enter queue</button>
      <button id="leave-queue-btn" disabled>Leaves queue</button>
      <button id="rejoin-game-btn" disabled>Rejoin game</button>
    </div>

    <div id="div-proposal" style="display: none">
      <span>You have a proposal !!!</span>
      <button id="accept-proposal-btn">Accept</button>
      <button id="decline-proposal-btn">Decline</button>
    </div>

    <div id="in-game-span" style="display: none">
      <b>currently in game</b>
      <button id="leave-game-btn">Leave game</button>
      <div>
        ACTIONS
        <button id="end-turn-btn">End turn</button>
        <button id="movement-turn-btn">Movement to</button>
        <button id="end-turn-btn3">Action</button>
      </div>
    </div>

    <script src="./test.js"></script>
  </body>
</html>
